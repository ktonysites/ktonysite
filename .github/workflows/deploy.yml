name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Fix asset paths for GitHub Pages
        run: |
          node -e "
            const fs = require('fs');
            const path = 'dist/public/index.html';
            let html = fs.readFileSync(path, 'utf8');
            html = html.replace(/src=\"\\/assets\\//g, 'src=\"/ktonysite/assets/');
            html = html.replace(/href=\"\\/assets\\//g, 'href=\"/ktonysite/assets/');
            fs.writeFileSync(path, html);
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          force_orphan: true
          user_name: ktonysites
          user_email: ktony7854@gmail.com
